name: Build LeapMore iOS v0.1.0

on:
  push:
    branches: [codex/build-ios-v0.1.0-20261125]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the iPhone simulator
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if ".iOS-" in runtime for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")))' )"
          xcrun simctl boot "$device"
          echo "IPHONE_SIMULATOR=$device" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare native project
        working-directory: app
        run: |
          xcodebuild -version
          npm install -g pnpm@11
          pnpm install --frozen-lockfile
          ruby -rxcodeproj -e 'puts Xcodeproj::VERSION' || gem install xcodeproj --user-install --no-document
          pnpm native:ios
      - name: Build device application and widget
        working-directory: app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Cold-launch the Release app on an iPhone simulator
        working-directory: app
        run: |
          set -euo pipefail
          device="$IPHONE_SIMULATOR"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/SimBuild" build
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/SimBuild/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl launch "$device" com.leapmore.app
          swiftc tests/ios-welcome.swift -o "$RUNNER_TEMP/check-welcome"
          for attempt in {1..12}; do
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/ios-welcome.png"
            if "$RUNNER_TEMP/check-welcome" "$RUNNER_TEMP/ios-welcome.png"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Save launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-welcome-screenshot
          path: ${{ runner.temp }}/ios-welcome.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          widget="$app/PlugIns/LeapWidget.appex"
          test -d "$widget"
          for bundle in "$app" "$widget"; do
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$bundle/Info.plist")" = 0.1.0
            executable="$(plutil -extract CFBundleExecutable raw -o - "$bundle/Info.plist")"
            lipo "$bundle/$executable" -verify_arch arm64
          done
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/App.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --norsrc --keepParent Payload "$GITHUB_WORKSPACE/LeapMore-v0.1.0-ios-build2-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: leapmore-ios-unsigned
          path: LeapMore-v0.1.0-ios-build2-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
